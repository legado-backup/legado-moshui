name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # 停在 v5（Node 24）而不是 v6：v6 把缓存功能拆成了闭源的 gradle-actions-caching，
      # 升级即视为接受 Gradle 的 Terms of Use。要不要接受是个许可决定，不是顺手升个版本 ——
      # 三个 workflow 统一停在这里，要升一起升。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Compose 1.13.0-beta01 要求按 37.1 编译。托管镜像通常只有 37.0，缺了 checkAarMetadata 直接失败。
      - name: Install Android SDK platform 37.1
        run: |
          SM="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" -path '*/cmdline-tools/*/bin/sdkmanager' | head -n 1)"
          test -n "$SM"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-37.1"

      - name: Run unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run lint
        run: ./gradlew :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: inkwell-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 7
